name: generate snake animation

on:
  schedule:
    - cron: "0 6 * * *"   # se actualiza todos los días a las 6:00 UTC
  workflow_dispatch:        # también puedes ejecutarlo manualmente desde GitHub
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Kvilleda089
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
